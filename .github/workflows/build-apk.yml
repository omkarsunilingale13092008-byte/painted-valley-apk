name: Build Painted Valley Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Clone Painted Valley
        run: |
          git clone https://git.patch.gg/blendi/painted-valley.git game
          cp -v touch-joystick.js game/ || true
          cp -v patch-mobile.mjs game/ || true
      - name: Build
        run: |
          cd game
          node patch-mobile.mjs || true
          npm install
          npm run build || npx vite build
          npx cap init "Painted Valley" com.paintedvalley.app --web-dir=dist || npx cap init "Painted Valley" com.paintedvalley.app --web-dir=www || true
          npx cap add android || true
          npx cap copy || npx cap sync || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Painted-Valley-Android-APK
          path: "**/*.apk"