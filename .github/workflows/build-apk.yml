
name: Build Painted Valley Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Clone Painted Valley
        run: |
          git clone https://git.patch.gg/blendi/painted-valley.git game

          test -f touch-joystick.js
          test -f patch-mobile.mjs

          cp touch-joystick.js game/
          cp patch-mobile.mjs game/

      - name: Apply mobile patches
        working-directory: game
        run: |
          node patch-mobile.mjs

          grep -q "TouchControls" src/figure/input.js
          grep -q "this.touch.consume(s)" src/figure/input.js
          grep -q "pv-touch-start" src/valley/main.js

          echo "Mobile patches verified."

      - name: Install project dependencies
        working-directory: game
        run: |
          npm install --no-audit --no-fund

      - name: Install Capacitor
        working-directory: game
        run: |
          npm install @capacitor/core@6.2.1 \
                      @capacitor/android@6.2.1

          npm install --save-dev @capacitor/cli@6.2.1

      - name: Configure Capacitor
        working-directory: game
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.paintedvalley.app",
            "appName": "Painted Valley",
            "webDir": "dist"
          }
          EOF

      - name: Build web game
        working-directory: game
        run: |
          npm run build
          test -f dist/index.html

      - name: Create Android project
        working-directory: game
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Painted-Valley-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
